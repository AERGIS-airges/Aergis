name: Claude Code Interactive

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request:
    types: [opened, synchronize]

jobs:
  claude:
    if: ${{ github.actor != 'claude[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout Repository
        # Pinning actions/checkout@v4 to full commit SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Run Claude Code Action
        # Pinning anthropics/claude-code-action@v1 to full commit SHA
        uses: anthropics/claude-code-action@cfc3eb2a297e5df0efcd8ea6451e223ed33ba20e
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
