name: Claude Code Auto-Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      id-token: write

    steps:
      - name: Checkout Repository
        # Pinning actions/checkout@v4 to full commit SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Run Claude PR Review
        # Pinning anthropics/claude-code-action@v1 to full commit SHA
        uses: anthropics/claude-code-action@cfc3eb2a297e5df0efcd8ea6451e223ed33ba20e
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Analyze PR #${{ github.event.pull_request.number }} for potential bugs, security flaws, and performance issues.
            Provide constructive feedback as inline comments where appropriate.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*)"
