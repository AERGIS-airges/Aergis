name: Validate Agent Skills

on:
  push:
    paths:
      - '.agents/skills/**'
      - '.github/workflows/validate-agent-skills.yml'
  pull_request:
    paths:
      - '.agents/skills/**'
      - '.github/workflows/validate-agent-skills.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install Agent Skills reference validator
        run: python -m pip install 'skills-ref @ git+https://github.com/agentskills/agentskills.git#subdirectory=skills-ref'

      - name: Validate every project skill
        shell: bash
        run: |
          set -euo pipefail
          found=0
          while IFS= read -r -d '' skill_dir; do
            found=1
            echo "Validating ${skill_dir}"
            skills-ref validate "${skill_dir}"
          done < <(find .agents/skills -mindepth 1 -maxdepth 1 -type d -print0 | sort -z)
          test "${found}" -eq 1
